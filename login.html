<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AURA LOGIN</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#070816;
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  color:white;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
  linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size:40px 40px;
  z-index:-2;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  background:
  radial-gradient(circle at top left,#00ffee22,transparent 30%),
  radial-gradient(circle at bottom right,#ff00ff22,transparent 30%);
  z-index:-1;
}

.login-box{
  width:100%;
  max-width:430px;
  background:rgba(15,18,40,0.88);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:30px;
  padding:40px 30px;
  backdrop-filter:blur(14px);
  box-shadow:0 0 30px rgba(0,255,255,0.08);
}

.logo{
  text-align:center;
  font-size:40px;
  font-family:'Orbitron',sans-serif;
  font-weight:800;
  color:#00ffae;
  text-shadow:
  0 0 10px #00ffae,
  0 0 25px #00ffae;
  margin-bottom:12px;
}

.subtitle{
  text-align:center;
  color:#9ba3d9;
  letter-spacing:2px;
  font-size:13px;
  margin-bottom:35px;
}

.input-box{
  margin-bottom:22px;
}

.input-box label{
  display:block;
  margin-bottom:10px;
  color:#cdd3ff;
  font-size:14px;
}

.input-box input{
  width:100%;
  padding:16px;
  border:none;
  outline:none;
  border-radius:18px;
  background:#10142b;
  color:white;
  border:1px solid rgba(255,255,255,0.08);
  font-size:15px;
}

.input-box input:focus{
  border-color:#00ffee;
  box-shadow:0 0 15px rgba(0,255,255,0.2);
}

.login-btn{
  width:100%;
  padding:18px;
  border:none;
  border-radius:20px;
  background:linear-gradient(90deg,#00f7ff,#ff77ff);
  color:#111;
  font-weight:700;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

.login-btn:hover{
  transform:scale(1.03);
  box-shadow:0 0 20px #00ffee;
}

.error{
  margin-top:18px;
  text-align:center;
  color:#ff5b8f;
  font-size:14px;
}

</style>

</head>
<body>

<div class="login-box">

  <div class="logo">
    AURA LOGIN
  </div>

  <div class="subtitle">
    SECURE ADMIN ACCESS
  </div>

  <div class="input-box">
    <label>Email</label>
    <input type="email" id="email" placeholder="Enter email">
  </div>

  <div class="input-box">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password">
  </div>

  <button class="login-btn" onclick="login()">
    LOGIN
  </button>

  <div class="error" id="error"></div>

</div>

<script>

function login(){

  const email =
  document.getElementById("email").value;

  const password =
  document.getElementById("password").value;

  const error =
  document.getElementById("error");

  // CHANGE THESE

  const adminEmail =
  "admin@aura.com";

  const adminPassword =
  "123456";


  if(email === adminEmail &&
     password === adminPassword){

     localStorage.setItem(
     "auraAdminLogged","true"
     );

     window.location.href =
     "admin.html";

  }

  else{

    error.innerHTML =
    "Invalid Email or Password";

  }

}

</script>

</body>
</html>
