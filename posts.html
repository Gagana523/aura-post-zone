<!-- ANTI COPY -->

<script>

// DISABLE RIGHT CLICK

document.addEventListener('contextmenu',event=>event.preventDefault());

// DISABLE COPY SHORTCUTS

document.addEventListener('keydown',function(e){

if(
(e.ctrlKey && e.key === 'u') ||
(e.ctrlKey && e.key === 'c') ||
(e.ctrlKey && e.key === 's') ||
(e.ctrlKey && e.key === 'a') ||
(e.ctrlKey && e.key === 'x') ||
(e.ctrlKey && e.key === 'v') ||
(e.key === 'F12')
){

e.preventDefault();

}

});

</script>
