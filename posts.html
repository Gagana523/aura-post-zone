<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AURA CYBER LAB | POSTS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#070816;
  font-family:'Poppins',sans-serif;
  overflow-x:hidden;
  color:white;
  user-select:none;
}

/* BACKGROUND */

body::before{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:
  linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size:40px 40px;
  z-index:-2;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  background:
  radial-gradient(circle at top left,#00ffee22,transparent 30%),
  radial-gradient(circle at bottom right,#ff00ff22,transparent 30%);
  z-index:-1;
}

/* HEADER */

.header{
  text-align:center;
  padding:70px 20px 30px;
}

.logo{
  font-size:58px;
  font-family:'Orbitron',sans-serif;
  font-weight:800;
  color:#00ff88;
  text-shadow:
  0 0 10px #00ff88,
  0 0 30px #00ff88;
  margin-bottom:15px;
}

.subtitle{
  color:#8d92b3;
  font-size:14px;
  letter-spacing:3px;
}

/* GRID */

.posts-grid{
  width:95%;
  max-width:1400px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
  padding-bottom:70px;
}

/* CARD */

.card{
  position:relative;
  background:rgba(16,18,40,0.85);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:28px;
  padding:28px;
  min-height:430px;
  overflow:hidden;
  backdrop-filter:blur(12px);
  transition:0.4s;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.card:hover{
  transform:translateY(-10px) scale(1.02);
  border-color:#00ffee;
  box-shadow:
  0 0 30px #00ffee55,
  0 0 60px #ff00ff22;
}

/* NUMBER */

.card-number{
  font-size:68px;
  font-weight:800;
  line-height:1;
  font-family:'Orbitron',sans-serif;
  margin-bottom:20px;

  background:linear-gradient(90deg,#00f7ff,#ff77ff,#ffe600);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* TAG */

.tag{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:#0e8f67;
  color:white;
  padding:10px 20px;
  border-radius:30px;
  font-size:12px;
  letter-spacing:3px;
  width:fit-content;
  margin-bottom:25px;
}

.tag::before{
  content:"";
  width:10px;
  height:10px;
  background:#00ffae;
  border-radius:50%;
  box-shadow:0 0 10px #00ffae;
}

/* TITLE */

.card-title{
  font-size:34px;
  line-height:1.2;
  margin-bottom:18px;
  font-weight:700;
  font-family:'Orbitron',sans-serif;
}

/* DESC */

.card-desc{
  color:#d0d4ef;
  line-height:1.8;
  font-size:15px;
  margin-bottom:35px;
}

/* BOTTOM */

.card-info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

/* BUTTON */

.read-btn{
  text-decoration:none;
  padding:15px 24px;
  border-radius:18px;
  background:linear-gradient(90deg,#00f7ff,#ffd6ff);
  color:#111;
  font-weight:700;
  font-size:14px;
  letter-spacing:2px;
  transition:0.3s;
}

.read-btn:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px #00ffee;
}

/* DATE */

.date{
  font-family:'Orbitron',sans-serif;
  color:#d5d8ff;
  font-size:13px;
  letter-spacing:2px;
}

/* FOOTER */

.footer{
  text-align:center;
  padding:40px 20px 60px;
  color:#7c82a5;
  font-size:14px;
}

@media(max-width:768px){

  .logo{
    font-size:40px;
  }

  .card-title{
    font-size:28px;
  }

}

</style>

</head>

<body
oncopy="return false"
oncut="return false"
onpaste="return false"
oncontextmenu="return false"
>

<!-- HEADER -->

<div class="header">

  <div class="logo">
    AURA CYBER LAB POSTS
  </div>

  <div class="subtitle">
    ETHICAL HACKING • CYBER SECURITY • DIGITAL INTELLIGENCE
  </div>

</div>

<!-- POSTS -->



<!-- FOOTER -->

<div class="footer">
  © 2026 AURA CYBER LAB — ALL RIGHTS RESERVED
</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "AIzaSyA5AG9TgVkUA7pPpTeGAP5NieVeBcyrNv8",

  authDomain: "auracyber-lab-post-cms.firebaseapp.com",

  projectId: "auracyber-lab-post-cms",

  storageBucket: "auracyber-lab-post-cms.firebasestorage.app",

  messagingSenderId: "608879796160",

  appId: "1:608879796160:web:840c9fab1f0c2184d3b225"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const postsContainer =
document.getElementById("postsContainer");


async function loadPosts(){

  const querySnapshot =
  await getDocs(collection(db,"posts"));

  let count = 1;

  querySnapshot.forEach((doc)=>{

    const post = doc.data();

    postsContainer.innerHTML += `

    <div class="card">

      <div>

        <div class="card-number">
          #${String(count).padStart(3,'0')}
        </div>

        <div class="tag">
          ${post.tag || "AURA"}
        </div>

        <div class="card-title">
          ${post.title}
        </div>

        <div class="card-desc">
          ${post.description}
        </div>

      </div>

      <div class="card-info">

        <a href="${post.link}"
        target="_blank"
        class="read-btn">

          READ ARTICLE →

        </a>

        <div class="date">
          MAY 2026
        </div>

      </div>

    </div>

    `;

    count++;

  });

}

loadPosts();

</script>

<!-- SECURITY -->

<script>

document.addEventListener('keydown', function(e){

  if(
    e.ctrlKey && (
      e.key === 'c' ||
      e.key === 'u' ||
      e.key === 's' ||
      e.key === 'a'
    )
  ){
    e.preventDefault();
  }

});

</script>

</body>
</html>
