<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AURA CYBER LAB | POSTS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#070816;
  font-family:'Poppins',sans-serif;
  overflow-x:hidden;
  color:white;
  user-select:none;
}

/* BACKGROUND */

body::before{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:
  linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size:40px 40px;
  z-index:-2;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  background:
  radial-gradient(circle at top left,#00ffee22,transparent 30%),
  radial-gradient(circle at bottom right,#ff00ff22,transparent 30%);
  z-index:-1;
}

/* HEADER */

.header{
  text-align:center;
  padding:70px 20px 30px;
}

.logo{
  font-size:58px;
  font-family:'Orbitron',sans-serif;
  font-weight:800;
  color:#00ff88;
  text-shadow:
  0 0 10px #00ff88,
  0 0 30px #00ff88;
  margin-bottom:15px;
}

.subtitle{
  color:#8d92b3;
  font-size:14px;
  letter-spacing:3px;
}

/* GRID */

.posts-grid{
  width:95%;
  max-width:1600px;
  margin:auto;

  display:grid;

  grid-template-columns:
  repeat(auto-fit,400px);

  gap:28px;

  padding-bottom:70px;

  justify-content:start;
}
  
/* CARD */

.card{
  position:relative;

  background:
  linear-gradient(
    145deg,
    rgba(20,24,50,0.95),
    rgba(10,12,30,0.92)
  );

  border:1px solid rgba(255,255,255,0.06);

  border-radius:26px;

  padding:24px;

  width:400px;
  height:450px;

  overflow:hidden;

  backdrop-filter:blur(14px);

  transition:0.45s ease;

  display:flex;
  flex-direction:column;
  justify-content:space-between;

  box-shadow:
  0 0 15px rgba(0,255,255,0.06);
}
  
.card::before{
  content:"";
  position:absolute;
  inset:0;
  background:
  linear-gradient(
    130deg,
    transparent,
    rgba(0,255,255,0.08),
    transparent
  );

  transform:translateX(-100%);
  transition:0.6s;
}

.card:hover::before{
  transform:translateX(100%);
}
.card:hover{
  transform:
  translateY(-10px)
  scale(1.02);

  border-color:#00ffee;

  box-shadow:
  0 0 25px #00ffee55,
  0 0 60px #ff00ff22;
}

/* NUMBER */

.card-number{
  font-size:48px;

  font-weight:800;

  line-height:1;

  font-family:'Orbitron',sans-serif;

  margin-bottom:18px;

  background:
  linear-gradient(
    90deg,
    #00f7ff,
    #ff4fd8,
    #ffe600
  );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  text-shadow:
  0 0 18px rgba(0,255,255,0.45);
}
/* TAG */

.tag{
  position:relative;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  padding:12px 22px;

  border-radius:14px;

  font-size:11px;
  font-weight:600;

  letter-spacing:3px;

  text-transform:uppercase;

  width:fit-content;

  margin-bottom:22px;

  color:#00ffee;

  background:
  linear-gradient(
    135deg,
    rgba(0,255,255,0.12),
    rgba(255,0,255,0.10)
  );

  border:1px solid rgba(0,255,255,0.22);

  backdrop-filter:blur(10px);

  overflow:hidden;

  box-shadow:
  0 0 18px rgba(0,255,255,0.08);
}

.tag::before{
  content:"";

  width:8px;
  height:8px;

  border-radius:50%;

  margin-right:10px;

  background:#00ffee;

  box-shadow:
  0 0 10px #00ffee,
  0 0 20px #00ffee;
}
/* TITLE */

.card-title{
  font-size:30px;

  line-height:1.25;

  margin-bottom:16px;

  font-weight:700;

  font-family:'Orbitron',sans-serif;

  color:#ffffff;

  letter-spacing:1px;
}
/* DESC */

.card-desc{
  color:#cfd6ff;

  line-height:1.8;

  font-size:15px;

  font-weight:400;

  opacity:0.92;
}

/* BOTTOM */

.card-info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

/* BUTTON */

.read-btn{
  text-decoration:none;
  padding:15px 24px;
  border-radius:18px;
  background:linear-gradient(90deg,#00f7ff,#ffd6ff);
  color:#111;
  font-weight:700;
  font-size:14px;
  letter-spacing:2px;
  transition:0.3s;
}

.read-btn:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px #00ffee;
}

/* DATE */

.date{
  font-family:'Orbitron',sans-serif;
  color:#d5d8ff;
  font-size:13px;
  letter-spacing:2px;
}

/* FOOTER */

.footer{
  text-align:center;
  padding:40px 20px 60px;
  color:#7c82a5;
  font-size:14px;
}

@media(max-width:768px){

  .logo{
    font-size:40px;
  }

  .card-title{
    font-size:28px;
  }

}

</style>

</head>

<body
oncopy="return false"
oncut="return false"
onpaste="return false"
oncontextmenu="return false"
>

<!-- HEADER -->

<div class="header">

  <div class="logo">
    AURA CYBER LAB POSTS
  </div>

  <div class="subtitle">
    ETHICAL HACKING • CYBER SECURITY • DIGITAL INTELLIGENCE
  </div>

</div>

<!-- POSTS -->

<div class="posts-grid" id="postsContainer"></div>

<!-- FOOTER -->

<div class="footer">
  © 2026 AURA CYBER LAB — ALL RIGHTS RESERVED
</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "AIzaSyA5AG9TgVkUA7pPpTeGAP5NieVeBcyrNv8",

  authDomain: "auracyber-lab-post-cms.firebaseapp.com",

  projectId: "auracyber-lab-post-cms",

  storageBucket: "auracyber-lab-post-cms.firebasestorage.app",

  messagingSenderId: "608879796160",

  appId: "1:608879796160:web:840c9fab1f0c2184d3b225"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const postsContainer =
document.getElementById("postsContainer");


async function loadPosts(){

  const querySnapshot =
  await getDocs(collection(db,"posts"));

  let count = 1;

  querySnapshot.forEach((doc)=>{

    const post = doc.data();

    postsContainer.innerHTML += `

    <div class="card">

      <div>

        <div class="card-number">
          #${String(count).padStart(3,'0')}
        </div>

        <div class="tag">
          ${post.tag || "AURA"}
        </div>

        <div class="card-title">
          ${post.title}
        </div>

        <div class="card-desc">
          ${post.description}
        </div>

      </div>

      <div class="card-info">

        <a href="${post.link}"
        target="_blank"
        class="read-btn">

          READ ARTICLE →

        </a>

        <div class="date">
          MAY 2026
        </div>

      </div>

    </div>

    `;

    count++;

  });

}

loadPosts();

</script>

<!-- SECURITY -->

<script>

document.addEventListener('keydown', function(e){

  if(
    e.ctrlKey && (
      e.key === 'c' ||
      e.key === 'u' ||
      e.key === 's' ||
      e.key === 'a'
    )
  ){
    e.preventDefault();
  }

});

</script>

</body>
</html>
