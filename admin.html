<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AURA ADMIN PANEL</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#070816;
  font-family:'Poppins',sans-serif;
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:30px;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
  linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size:40px 40px;
  z-index:-2;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  background:
  radial-gradient(circle at top left,#00ffee22,transparent 30%),
  radial-gradient(circle at bottom right,#ff00ff22,transparent 30%);
  z-index:-1;
}

.panel{
  width:100%;
  max-width:650px;
  background:rgba(15,18,40,0.88);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:30px;
  padding:35px;
  backdrop-filter:blur(14px);
  box-shadow:0 0 30px rgba(0,255,255,0.08);
}

.title{
  text-align:center;
  font-size:38px;
  font-family:'Orbitron',sans-serif;
  margin-bottom:10px;
  color:#00ffae;
  text-shadow:0 0 15px #00ffae;
}

.subtitle{
  text-align:center;
  color:#9ba3d9;
  margin-bottom:35px;
  letter-spacing:2px;
  font-size:13px;
}

.input-box{
  margin-bottom:22px;
}

.input-box label{
  display:block;
  margin-bottom:10px;
  color:#cdd3ff;
  font-size:14px;
}

.input-box input,
.input-box textarea{
  width:100%;
  background:#10142b;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:18px;
  padding:16px;
  color:white;
  font-size:15px;
  outline:none;
}

.input-box textarea{
  min-height:140px;
  resize:none;
}

.input-box input:focus,
.input-box textarea:focus{
  border-color:#00ffee;
  box-shadow:0 0 15px rgba(0,255,255,0.2);
}

.upload-btn{
  width:100%;
  padding:18px;
  border:none;
  border-radius:20px;
  background:linear-gradient(90deg,#00f7ff,#ff77ff);
  color:#111;
  font-weight:700;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
  margin-top:10px;
}

.upload-btn:hover{
  transform:scale(1.03);
  box-shadow:0 0 20px #00ffee;
}

.status{
  margin-top:20px;
  text-align:center;
  color:#00ffae;
  font-weight:600;
}

</style>

</head>
<body>

<div class="panel">

  <div class="title">
    AURA ADMIN
  </div>

  <div class="subtitle">
    FIREBASE POST MANAGEMENT SYSTEM
  </div>

  <div class="input-box">
    <label>Post Title</label>
    <input type="text" id="title" placeholder="Enter title">
  </div>

  <div class="input-box">
    <label>Description</label>
    <textarea id="description" placeholder="Enter description"></textarea>
  </div>

  <div class="input-box">
    <label>Article Link</label>
    <input type="text" id="link" placeholder="https://example.com">
  </div>

  <div class="input-box">
    <label>Tag</label>
    <input type="text" id="tag" placeholder="ETHICAL / NEWS / TOOLS">
  </div>

  <button class="upload-btn" onclick="uploadPost()">
    UPLOAD POST
  </button>

  <div class="status" id="status"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "AIzaSyA5AG9TgVkUA7pPpTeGAP5NieVeBcyrNv8",

  authDomain: "auracyber-lab-post-cms.firebaseapp.com",

  projectId: "auracyber-lab-post-cms",

  storageBucket: "auracyber-lab-post-cms.firebasestorage.app",

  messagingSenderId: "608879796160",

  appId: "1:608879796160:web:840c9fab1f0c2184d3b225"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


window.uploadPost = async function(){

  const title =
  document.getElementById("title").value;

  const description =
  document.getElementById("description").value;

  const link =
  document.getElementById("link").value;

  const tag =
  document.getElementById("tag").value;

  const status =
  document.getElementById("status");

  if(!title || !description || !link){

    status.innerHTML = "Fill all fields!";
    return;

  }

  try{

await addDoc(collection(db,"posts"),{

  title,
  description,
  link,
  tag,

  createdAt: Date.now()

});

    status.innerHTML = "Post Uploaded Successfully 🔥";

    document.getElementById("title").value = "";
    document.getElementById("description").value = "";
    document.getElementById("link").value = "";
    document.getElementById("tag").value = "";

  }

  catch(error){

    status.innerHTML = error.message;

  }

}

</script>

</body>
</html>
